window.MSAL = {

let msalApp=null;
const auth={account:null,isAdmin:false};
// Build (once) the MSAL app. Returns null if the library isn't available.
async function ensureMsal(){
  if(msalApp)return msalApp;
  if(typeof msal==="undefined")return null; // CDN/library didn't load
  msalApp=new msal.PublicClientApplication({
    auth:{clientId:window.MSAL.clientId,authority:`https://login.microsoftonline.com/${window.MSAL.tenantId}`,redirectUri:location.href.split(/[?#]/)[0]},
    cache:{cacheLocation:"localStorage"},
  });
  if(typeof msalApp.initialize==="function")await msalApp.initialize();
  return msalApp;
}
async function authInit(){
  const app=await ensureMsal();
  if(!app)return; // signed-out; sign-in button will explain when clicked
  const resp=await app.handleRedirectPromise().catch(()=>null);
  auth.account=resp?.account||app.getAllAccounts()[0]||null;
  if(auth.account){
    // Admin gate uses a dedicated cma_admins table (just oids) that the anon
    // key is allowed to read — app_users is RLS-locked to the server API.
    const oid=auth.account.idTokenClaims?.oid||auth.account.localAccountId;
    const email=(auth.account.username||"").toLowerCase();
    auth.oid=oid;auth.email=email;
    try{
      const{data,error}=await sb.from("cma_admins").select("oid").eq("oid",oid).maybeSingle();
      if(error)auth.authError="Admin check couldn't read cma_admins: "+error.message;
      auth.isAdmin=!!data;
      if(!data&&!error)auth.authError="Signed in, but your account isn't an approved template admin";
    }catch(e){auth.isAdmin=false;auth.authError="Admin check failed: "+e.message;}
  }
}
async function signIn(){
  const app=await ensureMsal();
  if(!app){toast("Microsoft sign-in library didn't load — check your connection or ad-blocker, then reload");return;}
  try{await app.loginRedirect({scopes:["User.Read"]});}
  catch(e){toast("Sign-in failed: "+(e.message||e));}
}
function signOut(){
  if(msalApp&&auth.account)msalApp.logoutRedirect({account:auth.account});
}
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v)=>{const n=parseFloat(String(v??"").replace(/[$,\s%]/g,""));return isNaN(n)?0:n;};
const fmt = (n)=>Number(n||0).toLocaleString("en-NZ",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = (n)=>Number(n||0).toLocaleString("en-NZ");
const money = (v)=>v===""||v==null?"":"$"+fmt(num(v));
const money0 = (v)=>v===""||v==null?"":"$"+fmt0(num(v));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2600);}
function get(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o);}
function set(o,p,v){const ks=p.split(".");let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null)c[ks[i]]={};c=c[ks[i]];}c[ks[ks.length-1]]=v;}

// Structured text parser: "## Title" starts a block, "- x" bullet, else paragraph.
function parseBlocks(text){
  const out=[];let cur=null;
  String(text||"").split(/\r?\n/).forEach(line=>{
    const l=line.trim();if(!l)return;
    if(l.startsWith("## ")){cur={title:l.slice(3).trim(),items:[]};out.push(cur);return;}
    if(!cur){cur={title:"",items:[]};out.push(cur);}
    if(l.startsWith("- "))cur.items.push({t:"b",x:l.slice(2)});
    else cur.items.push({t:"p",x:l});
  });
  return out;
}
function blockHtml(b){ // items → paragraphs + <ul>
  let h="",ul=false;
  b.items.forEach(i=>{
    if(i.t==="b"){if(!ul){h+="<ul>";ul=true;}h+=`<li>${esc(i.x)}</li>`;}
    else{if(ul){h+="</ul>";ul=false;}h+=`<p>${esc(i.x)}</p>`;}
  });
  if(ul)h+="</ul>";
  return h;
}

// ── state + data ─────────────────────────────────────────────
const state={reportId:null,f:defaultForm(),profiles:[],blocks:{},reports:[],props:[],section:"cover"};

async function loadAll(){
  const [p,b,r]=await Promise.all([
    sb.from("broker_profiles").select("*").order("name"),
    sb.from("cma_content_blocks").select("*"),
    sb.from("cma_reports").select("id,title,property_address,updated_at").order("updated_at",{ascending:false}),
  ]);
  state.profiles=p.data||[];
  state.blocks={};(b.data||[]).forEach(x=>state.blocks[x.key]=x.content);
  state.reports=r.data||[];
  $("reportPick").innerHTML=`<option value="">— New report —</option>`+state.reports.map(x=>
    `<option value="${x.id}">${esc(x.title||x.property_address||"Untitled")}</option>`).join("");
  if(state.reportId)$("reportPick").value=state.reportId;
}
async function loadProps(){
  if(state.props.length)return state.props;
  // Case studies are sold comparables — exclude leases. PropCMA stores the
  // type in lease_or_sale ("Sale"/"Lease"); keep anything that isn't a lease
  // so blank/legacy rows still appear.
  const {data}=await sb.from("properties").select("*").limit(2000);
  state.props=(data||[]).filter(r=>String(r.lease_or_sale||"").toLowerCase()!=="lease")
    .sort((a,b)=>String(b.sale_date||"").localeCompare(String(a.sale_date||"")));
  return state.props;
}
function blockText(key){return state.f.overrides[key] ?? state.blocks[key] ?? "";}

  let a={logo:"",strategyPhoto:"",world:"",dm:["","","",""]};
  try{Object.assign(a,JSON.parse(state.blocks.office_assets||"{}"));}catch(e){}

// ── photo uploads — same bucket + resize approach as PropCMA ──
const PHOTO_BUCKET="property-photos";
function downscaleImg(file,max=1600,q=.85){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error("Could not process image")),"image/jpeg",q);
    };
    img.onerror=()=>rej(new Error("Not a readable image"));
    img.src=URL.createObjectURL(file);
  });
}
async function uploadPhoto(file){
  const blob=await downscaleImg(file);
  const path=`proposals/${Date.now()}_${Math.random().toString(36).slice(2,7)}.jpg`;
  const{error}=await sb.storage.from(PHOTO_BUCKET).upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000"});
  if(error)throw new Error(error.message);
  return sb.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
}
function pickAndUpload(cb){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    toast("Uploading photo…");
    try{cb(await uploadPhoto(f));toast("Photo uploaded");}
    catch(e){toast("Upload failed: "+e.message);}
  };
  inp.click();
}
const photoFld=(p,label,cls="")=>{

    <input data-path="${p}" value="${esc(v)}" style="flex:1" placeholder="Upload →" />
    <button class="btn" type="button" data-upload="${p}">Upload</button></div></label>`;
};

  {id:"profiles",label:"Broker profiles"},

];
function renderNav(){
  // Office library (Template content + Broker profiles) is admin-only.
  const adminOnly=new Set(["profiles","boilerplate"]);
  let inOfficeGrp=false;
  const items=SECTIONS.filter(s=>{
    if(s.grp){inOfficeGrp=(s.grp==="Office library");return auth.isAdmin||!inOfficeGrp;}
    return auth.isAdmin||!adminOnly.has(s.id);
  });
  // if a non-admin is parked on a gated section, bounce to cover
  if(!auth.isAdmin&&adminOnly.has(state.section))state.section="cover";
  $("sideNav").innerHTML=items.map(s=>s.grp?`<div class="grp">${s.grp}</div>`:
    `<a href="#" data-s="${s.id}" class="${state.section===s.id?"on":""}">${s.label}</a>`).join("");
  $("sideNav").querySelectorAll("[data-s]").forEach(a=>a.onclick=(e)=>{e.preventDefault();state.section=a.dataset.s;render();});
}
const txt=(p,label,cls="",ph="")=>`<label class="fld ${cls}"><span>${label}</span><input data-path="${p}" value="${esc(get(state.f,p)??"")}" placeholder="${esc(ph)}" /></label>`;
const area=(p,label,cls="",tall=false,ph="")=>`<label class="fld ${cls}"><span>${label}</span><textarea data-path="${p}" class="${tall?"tall":""}" placeholder="${esc(ph)}">${esc(get(state.f,p)??"")}</textarea></label>`;
const ovArea=(key,label,hint)=>`<label class="fld span3"><span>${label} <span class="mini">${hint||"Uses the office default; edit here to override for this report only."}</span></span><textarea data-ov="${key}" class="tall">${esc(blockText(key))}</textarea></label>`;

const PAGE_DEFS=[["contents","Contents"],["letter","Covering letter"],["exec","Executive summary — key terms"],["pillars","Executive summary — delivery pillars"],

  ["property","The property"],["swot","SWOT analysis"],["comps","Case studies"],["value","Estimated value"],["strategy","Sales strategy"],

  ["budget","Marketing budget"],["timeline","Marketing timeline"],["digital","Digital marketing overview"],["why","Why Colliers"],

function render(){
  renderNav();
  const f=state.f,S=state.section,m=$("main");
  if(S==="pages")m.innerHTML=`
    <section class="card"><h2>Pages to include</h2><p class="hint">Untick any page to leave it out of this proposal. The cover is always included.</p>
      <div class="grid" style="grid-template-columns:repeat(2,1fr)">${PAGE_DEFS.map(([k,l])=>`
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
          <input type="checkbox" data-inc="${k}" ${f.include[k]!==false?"checked":""} /> ${l}</label>`).join("")}</div></section>
    <section class="card"><h2>References</h2><p class="hint">Paste this proposal's two references — a heading (e.g. "Gough Investments | Glenn Taylor, Director") and the letter text. Leave blank to skip one.</p>
      ${f.refs.map((r,i)=>`<div class="grid" style="margin-bottom:14px">
        ${txt(`refs.${i}.title`,`Reference ${i+1} — company | contact`,"span3")}
        ${area(`refs.${i}.body`,`Reference ${i+1} — letter text`,"span3",true)}</div>`).join("")}</section>`;
  else if(S==="cover")m.innerHTML=`

// ── wiring ───────────────────────────────────────────────────
function wire(m){
  m.querySelectorAll("[data-inc]").forEach(cb=>cb.onchange=()=>{state.f.include[cb.dataset.inc]=cb.checked;});
  m.querySelectorAll("[data-path]").forEach(el=>{
    el.oninput=()=>set(state.f,el.dataset.path,el.value);
    // recalc totals when the field is left, not per keystroke — re-rendering
    // mid-typing was limiting cost entry to one digit at a time
    if(el.dataset.recalc!=null)el.onchange=()=>render();
  });
  m.querySelectorAll("[data-upload]").forEach(b=>b.onclick=()=>pickAndUpload(url=>{
    const p=b.dataset.upload;
    if(b.dataset.mode==="append"){const cur=get(state.f,p)||"";set(state.f,p,(cur?cur+"\n":"")+url);}
    else set(state.f,p,url);
    render();
  }));
  m.querySelectorAll("[data-ov]").forEach(el=>el.oninput=()=>{
    const k=el.dataset.ov;
    if(el.value===(state.blocks[k]??""))delete state.f.overrides[k];else state.f.overrides[k]=el.value;});
  m.querySelectorAll("[data-compdel]").forEach(b=>b.onclick=()=>{state.f.comps.splice(+b.dataset.compdel,1);render();});
  m.querySelectorAll("[data-compup]").forEach(b=>b.onclick=()=>{const i=+b.dataset.compup;const[c]=state.f.comps.splice(i,1);state.f.comps.splice(i-1,0,c);render();});
  m.querySelectorAll("[data-buddel]").forEach(b=>b.onclick=()=>{state.f.budget.items.splice(+b.dataset.buddel,1);render();});
  m.querySelectorAll("[data-tldel]").forEach(b=>b.onclick=()=>{state.f.timeline.rows.splice(+b.dataset.tldel,1);render();});
  const bAdd=$("btnBudAdd");if(bAdd)bAdd.onclick=()=>{state.f.budget.items.push({cat:"",desc:"",cost:""});render();};
  // Drag-to-reorder for any [data-dragrow] within a [data-draglist] array.
  let dragFrom=null;
  m.querySelectorAll("[data-dragrow]").forEach(row=>{
    row.ondragstart=(e)=>{dragFrom={list:row.dataset.draglist,i:+row.dataset.dragrow};e.dataTransfer.effectAllowed="move";};
    row.ondragover=(e)=>{e.preventDefault();row.style.borderTop="2px solid var(--blue)";};
    row.ondragleave=()=>{row.style.borderTop="";};
    row.ondrop=(e)=>{
      e.preventDefault();row.style.borderTop="";
      const to=+row.dataset.dragrow,list=row.dataset.draglist;
      if(!dragFrom||dragFrom.list!==list||dragFrom.i===to)return;
      const arr=get(state.f,list);
      const [moved]=arr.splice(dragFrom.i,1);
      arr.splice(to,0,moved);
      dragFrom=null;render();
    };
  });
  const tAdd=$("btnTlAdd");if(tAdd)tAdd.onclick=()=>{state.f.timeline.rows.push({label:"",marks:""});render();};
  const cMan=$("btnCompManual");if(cMan)cMan.onclick=()=>{state.f.comps.push({name:"",desc:"",salePrice:"",saleDate:"",method:"Deadline Private Treaty",landArea:"",nla:"",yield:"",photo:""});render();};
  const cPick=$("btnPickComp");if(cPick)cPick.onclick=()=>propertyPicker(p=>{
    state.f.comps.push(compFromProp(p));render();});

  ["pickLead","pickSup"].forEach(id=>{const el=$(id);if(!el)return;
    el.querySelectorAll(".pill").forEach(p=>p.onclick=()=>{
      const path=el.dataset.target,cur=get(state.f,path).split(",").map(x=>x.trim()).filter(Boolean);
      const i=cur.indexOf(p.dataset.code);
      if(i>=0)cur.splice(i,1);else cur.push(p.dataset.code);
      set(state.f,path,cur.join(","));render();});});
}
// Map a PropCMA properties row (real column names) to an editable case study.
function compFromProp(p){
  return{name:p.address||"",desc:p.notes||"",
    salePrice:p.sale_price?String(p.sale_price):"",
    saleDate:p.sale_date||"",
    method:"Deadline Private Treaty",
    landArea:p.land_area?`${fmt0(p.land_area)} sq m`:"",
    nla:p.sqm?`${fmt0(p.sqm)} sq m`:"",
    yield:p.initial_yield?`Circa ${p.initial_yield}%`:"",
    photo:(p.photos||"").split(/[\n,]/)[0]?.trim()||""};
}
async function propertyPicker(onPick){
  const d=$("dlg");$("dlgHead").textContent="Select a PropCMA property";
  $("dlgBody").innerHTML=`<input id="ppSearch" placeholder="Search address / vendor…" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:13px inherit;margin-bottom:10px" /><div id="ppList" class="mini">Loading…</div>`;
  d.showModal();
  const props=await loadProps();
  const draw=(q)=>{
    const ql=(q||"").toLowerCase();
    // Search the human fields only — searching the whole JSON row matched
    // stray "sale"/"lease" text and other noise.
    const hay=(p)=>[p.address,p.vendor,p.purchaser,p.category,p.broker].filter(Boolean).join(" ").toLowerCase();
    const hits=props.filter(p=>!ql||hay(p).includes(ql)).slice(0,40);
    $("ppList").innerHTML=hits.map((p,i)=>`<div class="pickRow" data-i="${props.indexOf(p)}"><span>${esc(p.address||"(no address)")}</span><span class="mini">${p.sale_price?money0(p.sale_price):""} ${esc(p.sale_date||"")}</span></div>`).join("")||"No matches.";
    $("ppList").querySelectorAll(".pickRow").forEach(r=>r.onclick=()=>{d.close();onPick(props[+r.dataset.i]);});
  };
  draw("");
  $("ppSearch").oninput=()=>draw($("ppSearch").value);
}

async function saveReport(){
  const f=state.f;
  const row={title:(f.cover.propertyName||f.property.address||"Untitled")+" — "+f.cover.title,
    client_name:f.letter.salutation,property_address:f.property.address||f.cover.addressLine,
    form:f,updated_at:new Date().toISOString()};
  let res;
  if(state.reportId)res=await sb.from("cma_reports").update(row).eq("id",state.reportId).select("id").single();
  else res=await sb.from("cma_reports").insert(row).select("id").single();
  if(res.error){toast("Save failed: "+res.error.message);return;}
  state.reportId=res.data.id;
  await loadAll();toast("Report saved");
}
async function openReport(id){
  if(!id){state.reportId=null;state.f=defaultForm();render();return;}
  const{data,error}=await sb.from("cma_reports").select("*").eq("id",id).single();
  if(error){toast("Couldn't open: "+error.message);return;}
  state.reportId=id;
  state.f=Object.assign(defaultForm(),data.form||{});
  render();
}

function pgHead(n){return `<div class="pghead">${n%2?`<span>Page ${n}</span><span class="rule"></span>`:`<span class="rule"></span><span>Page ${n}</span>`}</div>`;}
function lines(t){return String(t||"").split(/\r?\n/).map(s=>s.trim()).filter(Boolean);}
function ulOf(t){const l=lines(t).map(x=>x.replace(/^[-•*]\s+/,""));return l.length?`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";}
function paras(t){return lines(t).map(x=>`<p>${esc(x)}</p>`).join("");}

// SVG charts (all colours inline for print fidelity)
function svgValueBars(scen){
  const vals=scen.map(s=>num(s.value)),max=Math.max(...vals,1);
  const W=460,H=230,bw=64,gap=60,x0=110,base=170;
  // Per-scenario height nudge (px). 1mm ≈ 2.83 SVG units at this scale:
  // opportunist −5mm, market unchanged, premium +5mm.
  const nudge=[-14.2,0,14.2];
  let bars="";
  scen.forEach((s,i)=>{
    const h=Math.max(18,(vals[i]/max)*120+(nudge[i]||0)),x=x0+i*(bw+gap),y=base-h;
    const fill=["#5878b8","#2557a5","#12265e"][i]||"#2557a5";
    bars+=`<text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="11" font-weight="700" fill="#12265e">${esc(s.label)}</text>
    <rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${fill}"/>
    <line x1="${x-6}" y1="${base+4}" x2="${x+bw+6}" y2="${base+4}" stroke="#12265e" stroke-width="1"/>
    <text x="${x+bw/2}" y="${base+20}" text-anchor="middle" font-size="10" fill="#333a48">${esc(s.initYield)}%</text>
    <text x="${x+bw/2}" y="${base+36}" text-anchor="middle" font-size="10" fill="#333a48">${money0(s.value)}</text>
    <text x="${x+bw/2}" y="${base+52}" text-anchor="middle" font-size="10" fill="#333a48">${esc(s.mktYield)}%</text>`;
  });
  const lbl=(t,y)=>`<text x="${x0-14}" y="${y}" text-anchor="end" font-size="9" font-weight="700" fill="#5a6478">${t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">${bars}${lbl("Initial yield range",base+20)}${lbl("Appraisal values",base+36)}${lbl("Market yield range",base+52)}</svg>`;
}
function svgPie(l,n,i){
  const total=l+n+i||1,cx=130,cy=110,r=85;
  let a0=-Math.PI/2,out="";
  const seg=(v,fill)=>{
    const a1=a0+v/total*2*Math.PI;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;
    out+=`<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${fill}" stroke="#fff" stroke-width="2"/>`;
    a0=a1;
  };
  seg(l,"#12265e");seg(n,"#aab8dd");seg(i,"#e4eaf6");
  const L=(x,y,t,v,anchor)=>`<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#12265e">${t}</text><text x="${x}" y="${y+15}" text-anchor="${anchor}" font-size="11" fill="#333a48">${v}</text>`;
  return `<svg viewBox="0 0 420 230" width="100%" xmlns="http://www.w3.org/2000/svg">${out}
    ${L(250,60,"International",i,"start")}${L(250,125,"Local",l,"start")}${L(20,60,"National",n,"start")}
    <line x1="118" y1="42" x2="245" y2="50" stroke="#5a6478" stroke-width=".7"/>
    <line x1="185" y1="140" x2="245" y2="120" stroke="#5a6478" stroke-width=".7"/>
    <line x1="70" y1="80" x2="52" y2="62" stroke="#5a6478" stroke-width=".7"/></svg>`;
}
function svgAnnual(years,cs,ks){
  const max=Math.max(...cs,...ks,1),W=470,H=210,base=170,x0=40,gw=(W-x0-10)/years.length;
  let out="";
  for(let g=0;g<=max;g+=5)out+=`<line x1="${x0}" y1="${base-g/max*140}" x2="${W-10}" y2="${base-g/max*140}" stroke="#e4eaf6" stroke-width="1"/><text x="${x0-6}" y="${base-g/max*140+3}" text-anchor="end" font-size="8" fill="#5a6478">${g}</text>`;
  years.forEach((y,i)=>{
    const xc=x0+i*gw+gw/2;
    const hc=(cs[i]||0)/max*140,hk=(ks[i]||0)/max*140;
    out+=`<rect x="${xc-16}" y="${base-hc}" width="13" height="${hc}" fill="#12265e"/>
    <rect x="${xc+3}" y="${base-hk}" width="13" height="${hk}" fill="#aab8dd"/>
    <text x="${xc}" y="${base+14}" text-anchor="middle" font-size="9" fill="#333a48">${esc(y)}</text>`;
  });
  out+=`<rect x="${x0+40}" y="${H-12}" width="10" height="10" fill="#12265e"/><text x="${x0+55}" y="${H-3}" font-size="9" fill="#333a48">Colliers</text>
  <rect x="${x0+130}" y="${H-12}" width="10" height="10" fill="#aab8dd"/><text x="${x0+145}" y="${H-3}" font-size="9" fill="#333a48">Combined Competitors</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}

  // Pre-fill case studies from PropCMA's selected properties (?comps=id1,id2)
  const compIds=(new URLSearchParams(location.search).get("comps")||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(compIds.length&&!state.reportId){
    try{
      // Fetch the chosen rows by id directly — the user picked these, so we
      // don't apply the sale-only filter here. IDs may be numeric or uuid,
      // so match loosely on string form.
      const {data}=await sb.from("properties").select("*").in("id",compIds);
      const rows=data||[];
      compIds.forEach(id=>{const p=rows.find(x=>String(x.id)===String(id));if(p)state.f.comps.push(compFromProp(p));});
      if(state.f.comps.length){state.section="comps";toast(`${state.f.comps.length} case stud${state.f.comps.length===1?"y":"ies"} pre-filled from PropCMA — edit as needed`);}
      else toast("Couldn't load the selected properties — add them with the button");
    }catch(e){toast("Case study pre-fill failed: "+e.message);}
    render(); // re-render to show the pre-filled case studies
  }
})();
</script>
</body>
</html>
