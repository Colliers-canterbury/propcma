<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deal Board — South Island Commercial</title>
  <!-- deal-board 2026-08-13f — deal-board.html, .css, .js and -api.js
       must all be copied together; a partial copy will misbehave. -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/deal-board.css" />
</head>
<body>
  <div class="gate" id="gate"><div class="inner">Signing in…</div></div>

  <div id="app">
    <div class="top">
      <div>
        <h1 id="mtgTitle">Industrial Meeting</h1>
        <div class="meta" id="mtgDate"></div>
      </div>
      <div class="sp"></div>
      <span class="saver" id="saver">Ready</span>
      <button id="swapMeeting">Switch to Investment</button>
      <button id="projBtn">Projector</button>
      <button id="saveMtgBtn">Save meeting</button>
      <button onclick="window.print()">Print A3</button>
    </div>

    <div class="tally" id="tally"></div>

    <main>
      <div class="tabs">
        <button data-tab="board" class="on">Pipeline</button>
        <button data-tab="register">Buyers &amp; Tenants</button>
      </div>

      <div class="filterbar" id="filterbar">
      <label>Timing from <input type="date" id="fromDate"></label>
      <label>to <input type="date" id="toDate"></label>
      <button id="clearDates">All dates</button>
      <span class="filtered" id="filterNote"></span>
    </div>

    <section id="tab-board">
        <div class="grid2">
          <div id="stages"></div>
          <aside>
            <div class="card">
              <h3>Fines <span style="float:right;font-family:var(--mono)" id="fineTot"></span></h3>
              <div class="fines" id="fines"></div>
              <div class="fine-add">
                <select id="fineBroker" aria-label="Broker"></select>
                <span class="dollar">$</span>
                <input id="fineAmount" type="number" min="0" step="5" value="10"
                       inputmode="numeric" aria-label="Amount to add">
                <button id="addFine" class="btn-primary">Add</button>
              </div>
              <div class="ytd" id="finesYtd"></div>
            </div>
            <div class="card">
              <h3>Apologies <button class="clear" id="clearApologies">clear</button></h3>
              <div contenteditable data-ph="Who's out this week…" id="apologies"></div>
            </div>
            <div class="card">
              <h3>Minutes / actions <button class="clear" id="clearNotes">clear</button></h3>
              <textarea class="note" id="minutesBox" placeholder="Decisions and actions from the room…"></textarea>
            </div>
          </aside>
        </div>
      </section>

      <section id="tab-register" hidden>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
          <input class="search" id="regSearch" placeholder="Search requirement, size, suburb…">
          <span id="agentChips"></span>
          <button id="addReg" style="margin-left:auto">+ Add requirement</button>
        </div>
        <div class="card" style="padding:0">
          <table>
            <thead><tr><th style="width:200px">Buyer / tenant</th><th>Requirement</th>
              <th style="width:64px">Broker</th><th style="width:96px">Heat</th><th style="width:26px"></th></tr></thead>
            <tbody id="regBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <!-- Same auth stack as dealsheet.html — same tenant, same app
       registration, same token. Nothing new to register. -->
  <script src="js/msal-browser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/deal-board-api.js"></script>
  <script src="js/deal-board.js"></script>
</body>
</html>
